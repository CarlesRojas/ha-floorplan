# A theme for the Floorplan tiles: a dark gradient behind the dashboard,
# the tile tokens, and Home Assistant's own colors set to match, so the
# dialogs that open from a tile look like they belong to it.
#
# Copy this file into your Home Assistant config under themes/, with
#
#   frontend:
#     themes: !include_dir_merge_named themes
#
# in configuration.yaml, then pick Floorplan Glass in your profile or on the
# dashboard. Every --fp-* token is optional: the tiles have their own
# defaults, and these are the same values written out to change.
Floorplan Glass:
  modes:
    dark:
      # The dashboard background.
      lovelace-background: 'fixed center / cover no-repeat linear-gradient(160deg, #3a3f4f 0%, #1d2029 45%, #0d0e13 100%)'

      # Tiles.
      fp-tile-radius: 24px
      fp-tile-gap: 10px
      fp-tile-padding: 14px
      fp-tile-bg-active: 'rgba(255, 255, 255, 0.94)'
      fp-tile-bg-inactive: 'rgba(118, 118, 128, 0.24)'
      fp-tile-blur: 24px
      fp-tile-opacity-inactive: '1'
      fp-tile-opacity-unavailable: '0.45'
      fp-text-active: '#1c1c1e'
      fp-text-inactive: '#ffffff'
      fp-text-secondary-opacity: '0.6'
      fp-accent: '#0a84ff'
      fp-accent-light: '#ffb340'
      fp-accent-cover: '#32ade6'
      fp-accent-climate: '#ff9f0a'
      fp-font-tile: "'Inter', system-ui, sans-serif"
      fp-font-title: "'Inter Tight', system-ui, sans-serif"
      fp-title-size: 30px
      fp-title-opacity: '0.92'
      fp-title-color: '#ffffff'
      fp-menu-bg: 'rgba(44, 44, 48, 0.82)'
      fp-menu-text: '#ffffff'

      # The gap between tiles in a sections view.
      ha-section-grid-row-gap: 'var(--fp-tile-gap)'
      ha-section-grid-column-gap: 'var(--fp-tile-gap)'

      # Home Assistant's own colors, for the header, the other cards and
      # the more info dialog.
      primary-color: '#0a84ff'
      accent-color: '#ffb340'
      primary-text-color: '#ffffff'
      secondary-text-color: 'rgba(235, 235, 245, 0.6)'
      disabled-text-color: 'rgba(235, 235, 245, 0.3)'
      text-primary-color: '#ffffff'
      divider-color: 'rgba(84, 84, 88, 0.6)'
      primary-background-color: '#0d0e13'
      secondary-background-color: '#1c1c1e'
      card-background-color: 'rgba(28, 28, 30, 0.92)'
      ha-card-background: 'rgba(118, 118, 128, 0.24)'
      ha-card-border-radius: 24px
      ha-card-border-width: 0px
      ha-card-box-shadow: none
      app-header-background-color: transparent
      app-header-text-color: '#ffffff'
      app-header-border-bottom: none
      sidebar-background-color: '#111216'
      sidebar-text-color: '#ffffff'
      sidebar-icon-color: 'rgba(235, 235, 245, 0.6)'
      sidebar-selected-icon-color: '#0a84ff'
      sidebar-selected-text-color: '#0a84ff'
      state-icon-color: 'rgba(235, 235, 245, 0.6)'
      state-active-color: '#ffb340'
      ha-font-family-body: "'Inter', system-ui, sans-serif"
      ha-font-family-heading: "'Inter Tight', system-ui, sans-serif"

      # Dialogs.
      ha-dialog-border-radius: 28px
      ha-dialog-surface-background: '#1c1c1e'
      mdc-theme-surface: '#1c1c1e'
      mdc-dialog-scrim-color: 'rgba(0, 0, 0, 0.55)'
      dialog-backdrop-filter: blur(12px)
      ha-more-info-app-toolbar-title-font-weight: '600'
      input-fill-color: 'rgba(118, 118, 128, 0.24)'
      switch-checked-color: '#34c759'
      switch-checked-button-color: '#ffffff'
      switch-checked-track-color: '#34c759'
